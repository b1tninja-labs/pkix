[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback: with no
# build-system table pip injects an unpinned setuptools environment, so a build is
# neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pkix"
dynamic = ["version"]
# The description names the protocol and the documents, because that is the only text
# a person searching PyPI will read before deciding this is the library they need.
description = "Certification path discovery and validation per RFC 5280: trust anchors, name constraints, policy mapping and constraints, CRL and OCSP status hooks, explicit result provenance"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Justin Capella" }]
keywords = ["x509", "pkix", "path-validation", "trust-anchor", "name-constraints", "rfc5280"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
  "Typing :: Typed",
]
# Empty unless a module cannot be honest without it. Every entry needs a sentence in
# README.md explaining why the zero-dependency rule was broken for it.
#
# asn1core is the reason this project can claim what RFC 5280 sec. 4.1.1.3 requires: the
# signature is computed over "the ASN.1 DER encoded tbsCertificate", so a validator needs the
# bytes that arrived, not a codec's re-encoding of them. It is not published on an index yet --
# its own README says pre-alpha -- so until it ships this resolves from the sibling checkout in
# this workspace, exactly as certledger resolves it. That is a real cost and docs/plan.md
# already states it: no pkix release is promised before asn1core has one of its own.
#
# sigwire[verify] is the verify-only signature primitives (RSA PKCS #1 v1.5 and PSS, ECDSA, Ed25519) that
# `validity.check_signature` calls; it is the portfolio's one home for that arithmetic and, like
# asn1core, resolves from the sibling checkout until it publishes. `cryptography` is no longer a
# runtime dependency: pkix parses certificates with asn1core and verifies with sigwire.verify, and the
# test suite uses `cryptography` only to mint synthetic certificates and as a differential oracle.
dependencies = ["asn1core", "sigwire[verify]"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # dev-only: mints synthetic certificates (pkix never signs) and is the differential oracle.
  # Floored at 46.0.7, the installed and only tested release, as sigwire[verify] floors it
  # (PORTFOLIO.md section 9 item 15: the first version with the API used, not the newest).
  "cryptography>=46.0.7",
  # tools/check_dist.py cannot assert a wheel contains what the docs promise without
  # first being able to build one, so the build dependency belongs in the dev group.
  "build",
]

[project.urls]
Homepage = "https://github.com/b1tninja/pkix"
Repository = "https://github.com/b1tninja/pkix"
Issues = "https://github.com/b1tninja/pkix/issues"
Changelog = "https://github.com/b1tninja/pkix/blob/main/CHANGELOG.md"

[project.scripts]
pkix = "pkix.cli:main"


[tool.hatch.version]
path = "pkix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pkix"]

[tool.hatch.build.targets.sdist]
include = ["/pkix/", "/tests/", "/docs/", "/README.md", "/ROADMAP.md", "/CHANGELOG.md", "/LICENSE", "/NOTICE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "../asn1core" resolves the codec from the sibling checkout in this workspace, the way
# certledger resolves its two. It is not on an index yet, so a standalone clone cannot run
# the suite until asn1core publishes; the comment on `dependencies` says what that costs.
pythonpath = [".", "../asn1core", "../sigwire"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["pkix"]

[tool.coverage.report]
# The floor, deliberately ratcheted: a stub only earns
# coverage for the line that raises. Raise this in the commit that implements a
# milestone, never in a commit that only adds tests, so the number keeps meaning
# "this behaviour is exercised" rather than "this file was imported".
fail_under = 80
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# The CI jobs check asn1core out into .deps/ to satisfy an unpublished dependency; linting a
# borrowed checkout would make this project's gate depend on another project's style.
extend-exclude = [".deps"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501",  # line length is the formatter's job
]

[tool.ruff.lint.per-file-ignores]
# S101 in tests is the policy, S311 is a seeded generator rather than a token, and a
# test double has to accept parameters it ignores, which ARG would otherwise flag.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002"]
# The exception classes are named for the answer they give (SignatureInvalid, SignatureUnsupported),
# the way sigwire.verify names its own, and an `Error` suffix on each would only lengthen every except clause.
"pkix/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
# Checked against asn1core's own annotations when the sibling checkout is present; with
# ignore_missing_imports below, its absence degrades to unchecked rather than to a false error.
mypy_path = "../asn1core:../sigwire"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
