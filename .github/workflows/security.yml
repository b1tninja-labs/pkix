name: security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 2"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # pip is upgraded first because the audit covers pip itself, and a runner image's pip lags
      # the advisories by weeks: the finding would be about the image, not this project.
      - run: python -m pip install --upgrade pip
      # asn1core has to be present for the metadata to resolve (see ci.yml). pip-audit cannot look
      # it up on an index, and without --strict it reports it as scanned-nothing and moves on,
      # which is the accurate answer: an unpublished sibling has no advisory record to consult.
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/asn1core
          path: .deps/asn1core
      - run: python -m pip install --no-deps .deps/asn1core
      # sigwire[verify] (the verify-only signatures, formerly sigprim) is an unpublished sibling too;
      # cryptography arrives through this project's own dependencies, so --no-deps is enough.
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/sigwire
          path: .deps/sigwire
      - run: python -m pip install --no-deps .deps/sigwire
      - run: python -m pip install -e ".[dev]" pip-audit
      # The resolved environment is audited rather than the declarations, because the declarations
      # are floors. It is audited in place rather than through a frozen requirements file: a freeze
      # records this project's own editable install as `-e git+https://github.com/...`, and pip-audit
      # re-resolves that line by cloning the repository, which fails without a credential while the
      # repository is private (runs 42341368183 and 42341370024). The project is skipped rather than
      # audited because it is the code under review, not a published dependency; --strict is left off
      # because it turns that deliberate skip into a failure.
      - run: python -m pip_audit --progress-spinner off --skip-editable
