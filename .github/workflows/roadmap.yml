name: roadmap

# The obligation matrix and the issues derived from it must agree, and every row must name a callable that
# exists. The check is read-only. It installs projecthub, which is public, so no token beyond the job's own
# is needed; the issues live in the public b1tninja-labs/portfolio.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned, so a projecthub change cannot move this gate without a commit here.
      - run: >-
          python -m pip install --quiet pytest==9.0.3
          "projecthub @ git+https://github.com/b1tninja-labs/projecthub@f1f33b07f1399a283410712caf552b375ba8e1d6"
      - name: Every row must name a real callable
        run: python -m pytest -q tests/test_roadmap_rows.py
      - name: The matrix and the issues derived from it must agree
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          project=$(basename "$GITHUB_WORKSPACE")
          # --root expects <root>/<project>/ROADMAP.md. Build that shape instead of guessing at the
          # runner's directory layout, which is a convention and not a contract.
          root=$(mktemp -d)
          mkdir -p "$root/$project"
          cp ROADMAP.md "$root/$project/"
          python -m projecthub sync --check --project "$project" --root "$root" --org "$GITHUB_REPOSITORY_OWNER"
