name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # asn1core is load-bearing (see the comment in pyproject.toml) and is not on an index yet,
      # so the job installs it from its own repository before resolving this project's metadata.
      # The checkout lands in .deps/ rather than beside the project because actions/checkout
      # refuses a path outside the workspace; .deps is excluded from ruff for that reason.
      # When asn1core publishes, this step and the sibling paths in pyproject.toml come out
      # together -- one of the few places in this repository where a CI step is temporary.
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/asn1core
          path: .deps/asn1core
      - run: python -m pip install --no-deps .deps/asn1core
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy pkix tests
      # check_dist inspects a built wheel, and the generated workflow never built one. The step failed
      # identically at home and in CI ("no wheel in dist/"); it only ever looked green locally because
      # dist/ held a wheel left over from an earlier manual build, which is a cache pretending to be a
      # check. Also missing from the forge templates, so every generated project inherits it.
      - run: python -m pip install --quiet build
      - run: python -m build --wheel --quiet
      - run: python tools/check_dist.py

  test:
    # A socket option that exists only on Linux is exactly the bug a Linux-only CI never
    # sees, and multicast, UDP send buffers and interface enumeration differ per platform.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/checkout@v4
        with:
          repository: b1tninja/asn1core
          path: .deps/asn1core
      - run: python -m pip install --no-deps .deps/asn1core
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov
      # Asserts stripped: a wire path guarded by assert is unguarded in production.
      - run: python -O -m pytest -q
